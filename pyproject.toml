[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extremeloss"
version = "0.7.2"
description = "Extreme-value tail estimation for large claims: peaks-over-threshold GPD fitting, threshold diagnostics, return levels, and severity splicing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Michael Bryant" }]
keywords = [
    "actuarial",
    "risk",
    "extreme value theory",
    "tail risk",
    "rare events",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.8",
]

[project.optional-dependencies]
actuarialpy = ["actuarialpy>=0.46,<0.47"]
dev = [
    "actuarialpy>=0.46,<0.47",
    "pytest>=8.0",
    # cross-package conformance and worked-example pin tests
    "lossmodels>=0.8",
    "risksim>=0.5",
    "ratingmodels>=0.9",
    "experiencestudies>=0.5",
]
plot = ["matplotlib>=3.6"]
splice = ["lossmodels>=0.8,<0.9"]

[project.urls]
Homepage = "https://github.com/OpenActuarial/extremeloss"
Documentation = "https://openactuarial.org/extremeloss.html"
Repository = "https://github.com/OpenActuarial/extremeloss"
Issues = "https://github.com/OpenActuarial/extremeloss/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/extremeloss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
